<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    form { display: grid; gap: 10px; margin: 18px 0; }
    label { font-size: 14px; color: #bfd0e5; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid #51667c; border-radius: 10px; background: #0c1520; color: #ecf4ff; font: inherit; }
    button { padding: 10px 16px; border: 1px solid #8ad8df; border-radius: 10px; background: #1a2a3d; color: #ecf4ff; font: inherit; font-weight: 700; cursor: pointer; }
    button.danger { border-color: #d07384; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .status { min-height: 1.5em; font-size: 15px; color: #ffd28a; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    li strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { display: block; color: #bfd0e5; white-space: pre-wrap; margin-bottom: 10px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">보너스 작전 - 무차별 로그인</div>
    <h1>자료실</h1>
    <p>로그인한 계정만 자료를 볼 수 있습니다. 아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <div class="notice">로그인은 신원 확인일 뿐입니다. 다른 사람의 자료를 막는 일은 다음 단계에서 이어집니다.</div>
    <div id="status" class="status" role="status" aria-live="polite"></div>

    <form id="login" hidden>
      <label for="email">이메일</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <div class="row"><button type="submit">로그인</button></div>
    </form>

    <section id="app" hidden>
      <div class="row">
        <span id="who"></span>
        <button id="logout" type="button">로그아웃</button>
      </div>
      <form id="add">
        <label for="title">제목</label>
        <input id="title" maxlength="200" required>
        <label for="body">내용</label>
        <textarea id="body" rows="3" maxlength="5000"></textarea>
        <div class="row"><button type="submit">메모 추가</button></div>
      </form>
      <ul id="notes" aria-live="polite"></ul>
    </section>
  </main>
  <script type="module">
    // 이 화면에는 저장소 키가 없습니다. 로그인과 자료 요청은 모두 서버 함수(/api/...)로 보냅니다.
    const STORAGE_KEY = 'defense-session';
    const $ = (id) => document.getElementById(id);
    const status = (text) => { $('status').textContent = text; };

    function readSession() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; }
    }
    function saveSession(session) {
      try {
        if (session) localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
        else localStorage.removeItem(STORAGE_KEY);
      } catch { /* 저장이 막혀 있어도 이번 화면에서는 동작합니다. */ }
      memory = session;
    }
    let memory = readSession();

    async function post(path, body) {
      const response = await fetch(path, {
        method: 'POST', cache: 'no-store',
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
      const payload = await response.json().catch(() => null);
      if (!response.ok) throw Object.assign(new Error(payload?.message ?? payload?.error ?? `요청 실패 (HTTP ${response.status})`), { status: response.status });
      return payload;
    }

    async function freshToken() {
      if (!memory) return null;
      if (memory.expires_at - Math.floor(Date.now() / 1000) < 60) {
        try { saveSession(await post('/api/auth/refresh', { refresh_token: memory.refresh_token })); }
        catch { saveSession(null); show(null); return null; }
      }
      return memory.access_token;
    }

    async function api(path, options = {}) {
      const token = await freshToken();
      const response = await fetch(path, {
        ...options, cache: 'no-store',
        headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
      });
      const payload = response.status === 204 ? null : await response.json().catch(() => null);
      if (!response.ok) throw new Error(payload?.message ?? payload?.error ?? `요청 실패 (HTTP ${response.status})`);
      return payload;
    }

    function renderNotes(notes) {
      const items = notes.map((note) => {
        const li = document.createElement('li');
        const title = document.createElement('strong');
        const body = document.createElement('span');
        title.textContent = note.title;
        body.textContent = note.body;
        const edit = document.createElement('button');
        edit.type = 'button';
        edit.textContent = '수정';
        edit.addEventListener('click', async () => {
          const next = prompt('새 제목', note.title);
          if (next === null) return;
          const nextBody = prompt('새 내용', note.body);
          if (nextBody === null) return;
          try { await api(`/api/notes/${note.id}`, { method: 'PUT', body: JSON.stringify({ title: next, body: nextBody }) }); await load(); }
          catch (error) { status(error.message); }
        });
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'danger';
        remove.textContent = '삭제';
        remove.addEventListener('click', async () => {
          try { await api(`/api/notes/${note.id}`, { method: 'DELETE' }); await load(); }
          catch (error) { status(error.message); }
        });
        const row = document.createElement('div');
        row.className = 'row';
        row.append(edit, remove);
        li.append(title, body, row);
        return li;
      });
      if (!items.length) {
        const empty = document.createElement('li');
        empty.textContent = '아직 메모가 없습니다. 위에서 추가해 보세요.';
        items.push(empty);
      }
      $('notes').replaceChildren(...items);
    }

    async function load() {
      try { renderNotes(await api('/api/notes')); status(''); }
      catch (error) { status(error.message); }
    }

    function show(session) {
      const loggedIn = Boolean(session);
      $('login').hidden = loggedIn;
      $('app').hidden = !loggedIn;
      $('who').textContent = loggedIn ? `${session.email} 로그인됨` : '';
      if (loggedIn) load(); else $('notes').replaceChildren();
    }

    $('login').addEventListener('submit', async (event) => {
      event.preventDefault();
      status('로그인 중입니다.');
      try {
        saveSession(await post('/api/auth/login', { email: $('email').value, password: $('password').value }));
        status('');
        show(memory);
      } catch (error) {
        status(`로그인하지 못했습니다: ${error.message}`);
      }
      $('password').value = '';
    });
    $('logout').addEventListener('click', () => { saveSession(null); show(null); status('로그아웃했습니다.'); });
    $('add').addEventListener('submit', async (event) => {
      event.preventDefault();
      try {
        await api('/api/notes', { method: 'POST', body: JSON.stringify({ title: $('title').value, body: $('body').value }) });
        $('add').reset();
        await load();
      } catch (error) { status(error.message); }
    });

    show(memory);
  </script>
</body>
</html>
